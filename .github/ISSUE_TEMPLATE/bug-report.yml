name: "Bug report"
description: "Something on the site or in the tooling is broken, ugly, or hard to use."
title: "Bug: <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. A good bug report is a real contribution —
        it is often more useful than the fix.

        If you already know how to fix it, say so at the bottom and claim it.

  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options:
        - "The website (index.html / styles.css / app.js)"
        - "The contributor data (data/contributors.json)"
        - "The validator script"
        - "The GitHub Actions workflow"
        - "Documentation (README, CONTRIBUTING, ACHIEVEMENTS, Code of Conduct)"
        - "Somewhere else / not sure"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: "Describe what you saw. Screenshots are welcome."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect instead?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: "How can someone else see the same thing?"
      placeholder: |
        1. Run `python3 -m http.server 8000`
        2. Open http://localhost:8000
        3. Shrink the window to phone width
        4. The contributor cards overlap
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Browser and device
      description: "Only if it is a website bug. Skip otherwise."
      placeholder: "Safari 18 on iPhone / Chrome on Windows 11"

  - type: checkboxes
    id: claim
    attributes:
      label: Do you want to fix it?
      options:
        - label: "I would like to fix this myself and open the pull request."
          required: false
